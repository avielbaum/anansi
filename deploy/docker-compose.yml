# Gateway plus one vLLM node on a Linux host with an NVIDIA GPU and the NVIDIA container toolkit.
# Run from the repo root: docker compose -f deploy/docker-compose.yml up --build
# Tested on an NVIDIA A10 (Ubuntu 22.04, Docker 29, vLLM 0.33): serves Qwen3-1.7B, ~165 requests/s at 32 in flight.
services:
  vllm:
    image: vllm/vllm-openai:latest   # pin a version in production
    command: ["Qwen/Qwen3-1.7B", "--max-model-len", "4096", "--gpu-memory-utilization", "0.5"]   # vLLM 0.33: the model is positional
    volumes: ["hf-cache:/root/.cache/huggingface"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
  gateway:
    build: {context: .., dockerfile: deploy/Dockerfile}
    ports: ["127.0.0.1:8080:8080"]   # plain HTTP: only a TLS proxy on this machine may reach it, never the internet
    volumes: ["../config.vllm.json:/etc/anansi/config.json:ro", "anansi-data:/data"]
    environment:
      ANANSI_ENV: ${ANANSI_ENV:-production}   # production refuses dev auth and the key 'change-me'; set ANANSI_ENV=dev for a local try-out
      ANANSI_ADMIN_TOKEN: ${ANANSI_ADMIN_TOKEN:-}
      STEAM_PUBLISHER_KEY: ${STEAM_PUBLISHER_KEY:-}
    depends_on: [vllm]
volumes:
  hf-cache:
  anansi-data:
