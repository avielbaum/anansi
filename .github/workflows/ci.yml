name: ci
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    services:
      postgres:   # a throwaway database: the store checks also run on Postgres
        image: postgres:16
        env: {POSTGRES_PASSWORD: test}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt "psycopg[binary]"
      - name: Gateway self-checks (SQLite and Postgres)
        env: {ANANSI_TEST_PG: "postgresql://postgres:test@127.0.0.1:5432/postgres"}
        run: python tests/test_gateway.py
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: "8.0.x"}
      - name: C# SDK against a live gateway
        run: |
          python tools/mock_node.py 9001 node-a & python tools/mock_node.py 9002 node-b &
          ANANSI_CONFIG=config.example.json python -m uvicorn gateway.app:make_app --factory --port 8080 --log-level warning &
          sleep 5
          dotnet run --project sdk/unity/ci
          node sdk/js/test.mjs   # the runner's default Node (18+) has fetch
  godot:
    runs-on: ubuntu-latest   # the real Godot engine, headless, against a live gateway
    env:
      GODOT: 4.3-stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Install Godot (checksum from the release page)
        run: |
          base=https://github.com/godotengine/godot/releases/download/$GODOT
          f=Godot_v${GODOT}_linux.x86_64.zip
          curl -fsSL -O $base/$f -O $base/SHA512-SUMS.txt
          grep " $f\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q $f
          mv Godot_v${GODOT}_linux.x86_64 /usr/local/bin/godot 2>/dev/null || sudo mv Godot_v${GODOT}_linux.x86_64 /usr/local/bin/godot
      - name: Start the gateway on mock nodes
        run: |
          python tools/mock_node.py 9001 node-a & python tools/mock_node.py 9002 node-b &
          ANANSI_CONFIG=config.example.json python -m uvicorn gateway.app:make_app --factory --port 8080 --log-level warning &
          sleep 5
      - name: Run the Godot SDK test
        run: |
          godot --headless --path sdk/godot --import || true
          godot --headless --path sdk/godot --script res://test/run.gd > godot.log 2>&1 || true
          cat godot.log
          grep -q "0 failed" godot.log && ! grep -q "SCRIPT ERROR\|Parse Error" godot.log
      - name: Hoppertunity (examples/hoppertunity) self-checks, against a gateway serving its title
        run: |
          diff -r sdk/godot/addons/anansi examples/hoppertunity/addons/anansi   # the game ships a copy of the SDK: keep it in step
          python -c "import json; c=json.load(open('examples/hoppertunity/config.hoppertunity.json')); c['nodes']=[{'url':'http://127.0.0.1:9001','models':['npc-small'],'region':'local'}]; json.dump(c,open('/tmp/hop.json','w'))"
          ANANSI_CONFIG=/tmp/hop.json python -m uvicorn gateway.app:make_app --factory --port 8081 --log-level warning &
          sleep 5
          godot --headless --path examples/hoppertunity --import || true
          HOP_GATEWAY=http://127.0.0.1:8081 HOP_REQUIRE_LIVE=1 godot --headless --path examples/hoppertunity --script res://test/run.gd > hop.log 2>&1 || true
          cat hop.log
          grep -q "^0 failed" hop.log && ! grep -q "SCRIPT ERROR\|Parse Error" hop.log
      - name: Cache the Godot export templates
        uses: actions/cache@v4
        with: {path: ~/.local/share/godot/export_templates, key: "godot-templates-linux-web-${{ env.GODOT }}"}
      - name: Install the Linux and web export templates (checksum from the release page)
        run: |
          d=~/.local/share/godot/export_templates/${GODOT/-/.}   # 4.3-stable -> 4.3.stable
          if [ ! -f $d/web_nothreads_release.zip ]; then
            f=Godot_v${GODOT}_export_templates.tpz
            curl -fsSL -O https://github.com/godotengine/godot/releases/download/$GODOT/$f
            grep " $f\$" SHA512-SUMS.txt | sha512sum -c -
            mkdir -p $d   # only what these tests need
            unzip -q -j $f templates/linux_release.x86_64 templates/web_nothreads_release.zip templates/version.txt -d $d
          fi
      - name: Export the test game and run it (the SDK in a release build, not the editor)
        run: |
          mkdir -p build
          godot --headless --path sdk/godot --export-release "Linux" $PWD/build/anansi_test.x86_64 > export.log 2>&1 || true
          cat export.log
          test -x build/anansi_test.x86_64
          ./build/anansi_test.x86_64 --headless > game.log 2>&1 || true
          cat game.log
          grep -q "0 failed" game.log && ! grep -q "SCRIPT ERROR\|Parse Error" game.log
      - name: Export Hoppertunity for the browser (WebGL 2, no threads)
        run: |
          mkdir -p examples/hoppertunity/build/web
          godot --headless --path examples/hoppertunity --export-release "Web" build/web/index.html > hopweb.log 2>&1 || true
          tail -5 hopweb.log
          test -s examples/hoppertunity/build/web/index.wasm && test -s examples/hoppertunity/build/web/index.pck
      - uses: actions/setup-node@v4
        with: {node-version: "22"}   # the browser check talks to Chrome with Node's built-in WebSocket
      - name: Hoppertunity in headless Chrome (software WebGL), does the web build run and draw?
        run: node examples/hoppertunity/test/web.mjs
